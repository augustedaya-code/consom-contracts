# Lance la compilation et tous les tests à chaque envoi sur GitHub.
# Résultat visible dans l'onglet « Actions » du dépôt (coche verte = tout passe).
name: Tests des contrats

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils TON
        run: npm install --no-audit --no-fund
      - name: Compiler les contrats
        run: npm run build
      - name: Lancer les tests
        run: npm test
